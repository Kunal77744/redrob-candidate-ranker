# ============================================================================
# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Claude"
  - "Gemini"
  - "Other"

ai_usage_summary: |
  Used Claude (via pair-programming agent) for code optimization, debugging logical edge cases in candidate availability scores, and structural code refactoring. Used Gemini for brainstorming the dynamic reasoning structures and UI wireframing. All candidate profile scoring is computed entirely offline locally without external APIs.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Rule-based candidate discoverer with a Two-Stage Hybrid Scoring Model. Sanitizes inputs first, blocking 100% of synthetic honeypot candidates based on impossible skill durations and career overlaps. Computes candidate profile alignment (experience Sweet-spot: 5-9 years, current title fit, and skill-level weights with endorsement trust factors) and scales it using a multiplicative behavioral Availability Modifier. Tie-breaks are handled alphabetically by candidate ID. CPU execution completes in ~8 seconds on 100,000 profiles.

